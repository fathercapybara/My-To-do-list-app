<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tasks</title>
  <meta name="description" content="Personal to-do list">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Shown if config.js hasn't been filled in -->
  <section id="setup" class="card center" hidden>
    <h1>Almost there</h1>
    <p>Open <code>config.js</code> and paste in your Supabase <strong>Project URL</strong> and <strong>anon public key</strong>, then redeploy.</p>
  </section>

  <!-- Sign in / sign up -->
  <section id="auth" class="card center" hidden>
    <div class="logo" aria-hidden="true">✓</div>
    <h1 id="auth-title">Sign in</h1>
    <form id="auth-form" novalidate>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" inputmode="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" required>
      <button id="auth-submit" class="primary" type="submit">Sign in</button>
    </form>
    <p id="auth-msg" class="msg" role="status"></p>
    <button id="auth-toggle" class="link" type="button">No account? Create one</button>
  </section>

  <!-- Main app -->
  <main id="app" hidden>
    <header class="top">
      <h1>Tasks</h1>
      <div class="top-right">
        <span id="status" class="status" title="Sync status"><i></i><span>Connecting…</span></span>
        <button id="install" class="ghost" hidden>Install</button>
        <button id="signout" class="ghost">Sign out</button>
      </div>
    </header>

    <form id="add-form" class="add" autocomplete="off">
      <input id="new-title" type="text" placeholder="Add a task…" maxlength="500" aria-label="New task" enterkeyhint="done">
      <button class="primary" type="submit" aria-label="Add task">Add</button>
    </form>

    <nav class="filters" aria-label="Filter tasks">
      <button data-filter="all" class="active">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
    </nav>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden></p>

    <footer class="foot">
      <span id="count"></span>
      <button id="clear-done" class="link">Clear completed</button>
    </footer>
  </main>

  <div id="toast" class="toast" role="alert" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
